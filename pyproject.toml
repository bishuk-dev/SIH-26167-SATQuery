[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "satquery"
version = "0.1.0"
description = "Evidence-grounded, sensor-aware remote-sensing analysis"
requires-python = ">=3.11"
dependencies = [
  "affine>=2.4,<4",
  "fastapi>=0.110,<1",
  "huggingface-hub==0.36.2",
  "numpy>=2,<3",
  "pillow>=11,<13",
  "pydantic>=2.10,<3",
  "PyYAML==6.0.3",
  "python-multipart>=0.0.20,<1",
  "rasterio>=1.4,<2",
  "torch>=2.6,<3",
  "transformers==4.57.6",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
]
training = [
  "accelerate>=1.10,<2",
  "hf-xet>=1.1,<2",
  "peft>=0.19.1,<1",
  "tensorboard>=2.18,<3",
]
grounding = [
  "fsspec[http]>=2024.10,<2027",
]
multisensor = [
  "pyarrow>=18,<24",
  "zstandard>=0.23,<1",
]

[tool.setuptools.packages.find]
include = ["satquery*"]

[tool.setuptools.package-data]
"satquery.registry" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-tmp"
