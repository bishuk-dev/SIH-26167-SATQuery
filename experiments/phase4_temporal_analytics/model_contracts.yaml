  sturm_sentinel1_unet:
    status: BLOCKED
    role: primary
    source:
      repository_url: https://github.com/STURM-WEO/STURM-Flood
      revision: c39d9bf8ba76302663c097ec4e905c918e1e131d
      revision_verified: main HEAD via GitHub API 2026-09-09
      license: CC_BY_SA_4.0_code_repository
    checkpoint:
      authority_url: https://doi.org/10.5281/zenodo.15189665
      concept_doi: 10.5281/zenodo.15189664
      doi_relationship: >-
        verified from Zenodo API 2026-09-09: 15189665 is the version record for the
        Sentinel-1 U-Net; the official repository README links the concept DOI and the
        official inference notebook downloads S1_model.tar.gz from the version record.
      filename: S1_model.tar.gz
      inner_weights_path: unet/1/model_weights.hdf5 (per official inference notebook)
      size_bytes: 1757682388
      publisher_hashes:
        md5: 14a046d9d7965f2a3c511acb1bbca57b
      md5_provenance: Zenodo API record checksum (verified 2026-09-09; identical to the previously recorded publisher MD5)
      locally_verified_sha256: null
    contract:
      task: flood_segmentation
      training_domain: STURM-Flood
      sensor_domain: [Sentinel-1]
      band_order: composite file band order defines model channel order; (VV, VH) per dataset documentation and input_shape n_bands=2; verify first-tile band descriptions at materialization
      radiometric_domain: whatever the composite GeoTIFFs encode; official inference applies NO conversion and NO normalization (unet_model normalize_inputs=False)
      input_shape: [128, 128, 2]
      architecture: TensorFlow/Keras unet_model, n_classes=2, n_blocks=6, class_weight_list [1, 1]
      output_semantics: 2-class softmax probabilities; water probability = channel 1
      threshold_or_decoder: score_threshold = 0.5 on channel 1 (official inference notebook)
      preprocessing_pipeline: rasterio read all bands out_dtype=float32, transpose to HWC, expand dims; no resizing, no normalization
      temporal_order: single_flood_observation
      source_config: inference.ipynb and utils/inference_metrics.py at pinned revision
      source_config_revision: c39d9bf8ba76302663c097ec4e905c918e1e131d
    dependencies:
      python: ">=3.8"
      pytorch: not_used_by_official_repository
      packages: [tensorflow (version unpinned upstream; pin at first install), tensorflow-io, numpy, pandas, matplotlib, rasterio, scikit-learn, requests, tqdm]
      operating_system: unresolved
    official_evaluation:
      dataset: STURM-Flood
      split: per-tile evaluation sampled from metadata CSV; no publisher-declared split
      command: official inference notebook with with_gt=True
      metrics: "[precision, recall, F1, IoU] via sklearn precision_score/recall_score/f1_score/jaccard_score"
    isolation_rule: >-
      The official model is TensorFlow/Keras. Record TensorFlow as an isolated
      model-specific dependency in a dedicated environment; do NOT reimplement in
      PyTorch and do NOT add TensorFlow to core project dependencies.
    blockers:
      - S1_model.tar.gz (1.76 GB) not downloaded; local SHA-256 pending; archive member names must be inspected safely before loading
      - S1 composite radiometric scaling must be verified from dataset bytes or the STURM paper (Big Earth Data 2025, DOI 10.1080/20964471.2025.2458714) before transfer evaluation
      - TensorFlow version pin unresolved

