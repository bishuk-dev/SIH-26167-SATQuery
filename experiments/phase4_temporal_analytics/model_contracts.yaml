        sha256: da3f569306dadd1fac5b64abc2a3d484571cd0ecf6410e1f152275cfe49a3618
      hash_provenance: >-
        sha256 read from the Hugging Face API LFS metadata (lfs.oid) for the file at
        the recorded repository revision on 2026-09-09; matches the previously recorded
        candidate identity. Locally computed SHA-256 after first download is still required.
      locally_verified_sha256: null
    contract:
      task: structural_change_segmentation
      training_domain: LEVIR-CD
      sensor_domain: [high_resolution_optical_rgb]
      band_order: [R, G, B]
      radiometric_domain: 8_bit_RGB
      input_shape: [2, 3, 512, 512]
      data_preprocessor:
        type: DualInputSegDataPreProcessor
        mean_rgb: [123.675, 116.28, 103.53]
        std_rgb: [58.395, 57.12, 57.375]
        applied_per_temporal_input: true
        bgr_to_rgb: true
        size_divisor: 32
        source: configs/_base_/models/changer_r18.py at pinned revision
      test_transform: MultiImgResize scale=(1024, 1024) keep_ratio=True (LEVIR-CD patches are 1024x1024, so this is identity; no sliding-window tiling is configured for this config)
      output_semantics: 2-class softmax logits (num_classes=2, CrossEntropyLoss without sigmoid); class 1 = building-related change
      threshold_or_decoder: argmax/softmax over 2 classes; binary change = class-1 probability at the decoder default
      temporal_order: T1_then_T2 (data_prefix img_path_from=A/T1, img_path_to=B/T2)
      source_config: configs/changer/changer_ex_r18_512x512_40k_levircd.py
      source_config_revision: 790a1972b538baaaffd4c3022a4d9afaa3f861e5
      config_chain: [changer_ex_r18_512x512_40k_levircd.py, ../common/standard_512x512_40k_levircd.py, ../common/standard_256x256_40k_levircd.py, ../_base_/models/changer_r18.py]
    dataset_interface:
      dataset_type: LEVIR_CD_Dataset
      data_root: data/LEVIR-CD
      data_prefix: {seg_map_path: label, img_path_from: A, img_path_to: B}
      metrics: mmseg.IoUMetric with iou_metrics [mFscore, mIoU]
    dependencies:
      python: ">=3.11"
      pytorch: pinned via open-cd requirements at first install; runtime.txt lists matplotlib/numpy/packaging/prettytable/scipy and requires optional.txt for torch/mmcv stacks
      packages: [open-cd, mmengine, mmcv, mmpretrain, mmsegmentation, mmdet]
      operating_system: [Linux_preferred_by_upstream_toolchain]
    official_evaluation:
      dataset: LEVIR-CD
      split: val (config val_dataloader)
      command: python tools/test.py configs/changer/changer_ex_r18_512x512_40k_levircd.py CHECKPOINT
      metrics: [mIoU, mFscore]
    blockers:
      - checkpoint bytes not downloaded yet; local SHA-256 must equal publisher-recorded da3f569306dadd1fac5b64abc2a3d484571cd0ecf6410e1f152275cfe49a3618
      - exact mmcv/mmengine/mmdet dependency lock not frozen (install into isolated model-specific environment at first execution)
      - safe checkpoint loading path (torch.load weights_only or equivalent) not yet validated against the actual file

