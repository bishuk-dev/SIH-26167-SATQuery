      authority_relationship: >-
        the official Open-CD README header (at the pinned revision) links this Hugging
        Face repository as the official Checkpoint distribution; it is therefore the
        publisher-owned transport record, not a third-party mirror.
      repository_revision: 6b88e874f8dea7430a2ab1ed84b356c6a67128a
      filename: LEVIR-CD/ChangerEx_r18-512x512_40k_levircd.pth
      size_bytes: 136880383
