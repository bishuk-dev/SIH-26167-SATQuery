  levir_cc:
    status: BLOCKED
    role: primary_benchmark
    authority:
      title: LEVIR-CC remote sensing change captioning dataset
      landing_url: https://github.com/Chen-Yang-Liu/LEVIR-CC-Dataset
      repository_url: https://github.com/Chen-Yang-Liu/LEVIR-CC-Dataset
      doi: 10.1109/TGRS.2022.3218297
      version: repository_main_ef442261a9bb8bde11cec02d665f41c0baa1539e
    license:
      dataset_or_annotation_license: apache-2.0 (declared in the official Hugging Face dataset record lcybuaa/LEVIR-CC linked from the official dataset repository; applies to the dataset organization/annotations, NOT to the underlying imagery rights)
      imagery_terms: >-
        upstream imagery is Google Earth-derived; the Google Earth academic/non-commercial
        restriction that governs LEVIR-CD imagery is the operative constraint for the
        imagery itself. The apache-2.0 dataset declaration does NOT override imagery terms.
      redistribution_allowed: false
    transport:
      url: https://huggingface.co/datasets/lcybuaa/LEVIR-CC/tree/main
      mirror_role: publisher_linked_transport (Hugging Face dataset linked as official download source by the official dataset repository README)
      expected_files:
        - Levir-CC-dataset.zip
      expected_size_bytes: 2683666867
      publisher_hashes:
        sha256: e05d38c0fdfda8c9b2048d314e5f95974d8b81e1b9f83f107acc39d55015e130
      locally_verified_sha256: null
    contract:
      modalities: [optical_rgb]
      sensors: [Google_Earth_VHR]
      bands_or_polarizations: [R, G, B]
      radiometric_domain: 8_bit_RGB
      spatial_resolution_m: 0.5_to_0.8_per_official_paper; verify per archive
      pair_order: A_is_pre_phase_then_B_is_post_phase
      pair_count: 10077
      sentence_count: 50385
      caption_schema: all change descriptions live inside LevirCCcaptions.json (images[].images = [A_filename, B_filename], images[].sentences[]); there are NO per-pair reference files in the official layout
      image_normalization_reference:
        A_mean_rgb: [0.44152, 0.43863, 0.37418]
        A_var_rgb: [0.17623, 0.16578, 0.15337]
        B_mean_rgb: [0.33992, 0.33383, 0.28561]
        B_var_rgb: [0.13035, 0.12678, 0.11959]
      labels: multiple natural-language change descriptions per pair
      label_limitations: [caption references are not segmentation masks, captions cannot support area measurement]
    splits:
      authority_defined: true
      grouping_unit: temporal_pair
      train: images/train (A/B)
      validation: images/val (A/B)
      test: images/test (A/B)
      test_sealed: true
    references:
      - url: https://github.com/Chen-Yang-Liu/LEVIR-CC-Dataset
        supports: official dataset repository, layout, pair/sentence counts, per-folder mean/variance, download sources
      - url: https://huggingface.co/datasets/lcybuaa/LEVIR-CC
        supports: publisher-linked transport archive, size 2683666867 bytes, sha256 e05d38c0fdfda8c9b2048d314e5f95974d8b81e1b9f83f107acc39d55015e130, apache-2.0 license declaration
      - url: https://github.com/ShizhenChang/Chg2Cap
        supports: official Chg2Cap data layout and A/B temporal semantics
    blockers:
      - archive bytes not locally verified (download once, record size + SHA-256, compare against publisher sha256)
      - LevirCCcaptions.json field-level schema and exact validation membership not yet inspected from bytes
      - "imagery-rights confirmation pending: apache-2.0 covers the dataset package only; Google Earth upstream terms must be confirmed as compatible with the planned use before any execution"

