      - "no publisher-declared split: any train/validation split must be derived and frozen from event grouping with recorded rule"

  sen1floods11:
    status: BLOCKED
    role: independent_external_holdout
    authority:
      title: Sen1Floods11
      landing_url: https://github.com/cloudtostreet/Sen1Floods11
      repository_url: https://github.com/cloudtostreet/Sen1Floods11
      doi: null
      version: v1.1 (bucket restructure documented in README; repository_master_b9e460dabe70230111a3c3d36cd0c5ce03606ee9)
    license:
      dataset_license: not stated in official repository README or as a LICENSE file (re-checked 2026-09-09)
      imagery_terms: Sentinel-1 source terms require confirmation
      redistribution_allowed: null
    transport:
      url: gs://sen1floods11 (v1.1 layout; bucket listing verified unauthenticated 2026-09-09)
      mirror_role: official_publisher_bucket
      expected_files:
        - v1.1/Sen1Floods11_Metadata.geojson
        - v1.1/catalog.zip
        - v1.1/data/flood_events/HandLabeled/S1Hand/EVENT_CHIPID_S1Hand.tif
        - v1.1/data/flood_events/HandLabeled/LabelHand/EVENT_CHIPID_LabelHand.tif
        - v1.1/data/flood_events/HandLabeled/QCHand/EVENT_CHIPID_QCHand.tif
        - v1.1/splits/flood_handlabeled/flood_train_data.csv
        - v1.1/splits/flood_handlabeled/flood_valid_data.csv
        - v1.1/splits/flood_handlabeled/flood_test_data.csv
        - v1.1/splits/flood_handlabeled/flood_bolivia_data.csv
      expected_size_bytes: null
      publisher_hashes: per-object GCS md5Hash metadata is available from the bucket API (verified for sample objects); full manifest to be frozen at first sync
      locally_verified_sha256: null
    contract:
      modalities: [sar]
      sensors: [Sentinel-1_GRD_IW]
      bands_or_polarizations: [VV, VH]
      band_order: [VV, VH]
      radiometric_domain: backscatter_db (float32)
      spatial_resolution_m: 10
      chip_size_px: [512, 512]
      crs: EPSG:4326
      pair_order: single_observation_per_chip; event dates from Sen1Floods11_Metadata.geojson
      file_naming: EVENT_CHIPID_LAYER.tif (e.g. Bolivia_103757_S1Hand.tif); chip IDs unique per event
      labels: water/flood extent masks per QC/LabelHand layer (values -1 NoData/Not Valid, 0 Not Water, 1 Water; int16)
      label_layer: QC / LabelHand
      label_values: [-1_no_data_or_not_valid, 0_not_water, 1_water]
      label_dtype: int16
      splits:
        source: v1.1/splits/flood_handlabeled CSVs (train/valid/test/bolivia) with sizes recorded from bucket listing
      label_limitations: [independent holdout only, no threshold tuning]
    compatibility_gate:
      rule: >-
        STURM's audited inference contract reads composite bands in file order as
        float32 with NO normalization (normalize_inputs=False) and threshold 0.5.
        Sen1Floods11 S1Hand chips are float32 dB VV/VH. Transfer is authorized only
        if STURM's composite radiometric scaling (verified from dataset bytes or the
        STURM paper) is demonstrably the same dB scaling; otherwise the external
        STURM evaluation is recorded BLOCKED_INPUT_CONTRACT. No conversion may be guessed.
    splits:
      authority_defined: true
      grouping_unit: flood_event_and_chip
      train: v1.1/splits/flood_handlabeled/flood_train_data.csv
      validation: v1.1/splits/flood_handlabeled/flood_valid_data.csv
      test: v1.1/splits/flood_handlabeled/flood_test_data.csv
      test_sealed: true
    references:
      - url: https://github.com/cloudtostreet/Sen1Floods11
        supports: bucket layout, EVENT_CHIPID_LAYER naming, S1 512x512 2-band dB VV/VH, QC label values, WGS84 10 m, event metadata fields
      - url: https://storage.googleapis.com/storage/v1/b/sen1floods11/o
        supports: v1.1 bucket structure, split CSV file names/sizes, per-object md5Hash metadata (API-verified 2026-09-09)
    blockers:
      - dataset license unresolved (no LICENSE file or README statement)
      - bucket manifest with per-file hashes and exact split membership not frozen locally
      - STURM composite radiometric scaling not yet verified, so transfer compatibility is undecided (BLOCKED_INPUT_CONTRACT candidate)

