    role: primary_benchmark
    authority:
      title: LEVIR-CD
      landing_url: https://justchenhao.github.io/LEVIR/
      repository_url: https://github.com/justchenhao/LEVIR
      doi: 10.3390/rs12101662
      version: repository_master_fb19600da4dad999b6dd07c635a5c79fdf7bc935
    license:
