        supports: version record, CC-BY-4.0, Dataset.zip size 3985215183 bytes, md5 0e4172e74a4cf2e4c608c14d1588d1d9 (API-verified 2026-09-09)
      - url: https://github.com/STURM-WEO/STURM-Flood
