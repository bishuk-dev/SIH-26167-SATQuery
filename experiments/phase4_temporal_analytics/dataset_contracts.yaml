datasets:
  oscd:
    status: BLOCKED
    role: primary_benchmark
    authority:
      title: Onera Satellite Change Detection Dataset
      landing_url: https://rcdaudt.github.io/oscd/
      repository_url: null
      doi: 10.1109/IGARSS.2018.8518015
      version: website_current_2026-09-09
    license:
      dataset_license: CC BY 4.0
      imagery_terms: IEEE DataPort metadata declares CC BY 4.0 (verified in page metadata 2026-09-09); downloadable-archive terms require logged-in access
      redistribution_allowed: null
    transport:
      url: https://ieee-dataport.org/open-access/oscd-onera-satellite-change-detection
      mirror_role: official_publisher_page
      expected_files: []
      expected_size_bytes: null
      publisher_hashes: {}
      locally_verified_sha256: null
    contract:
      modalities: [multispectral_optical]
      sensors: [Sentinel-2]
      bands_or_polarizations: [B01, B02, B03, B04, B05, B06, B07, B08, B8A, B09, B10, B11, B12]
      radiometric_domain: not stated on project page; verify from archive README.txt and file bytes
      spatial_resolution_m: [10, 20, 60]
      pair_order: T1_then_T2
      registration_claim: registered pairs according to project page; verify transforms in files
      labels: pixel_level_binary_change; urban changes such as buildings and roads
      label_limitations: [not a water-expansion ground truth, not a vegetation-loss ground truth, not a label for any specific spectral-index change]
    layout:
      note: >-
        The publisher archive is login-gated on IEEE DataPort and ships a README.txt;
        the actual archive member layout has NOT been observed and must not be assumed.
        In particular, do NOT assume one 13-band T1.tif/T2.tif per pair: the dataset
        ships per-resolution native grids and the observed on-disk tiling must be frozen
        from the first authorized download.
      materialization_rule: >-
        Bands at 10 m stay on their native grid; 20 m and 60 m bands are resampled to the
        10 m grid with explicitly recorded resampling kernels (bilinear for continuous
        reflectance) into derived analysis grids; every derived tile records parent hash,
        source/destination grids, CRS, resampling, and transform. Native-resolution index
        computation uses only native-grid bands.
    splits:
      authority_defined: true
      grouping_unit: registered_temporal_pair
      train: 14 pairs
      validation: null
      test: 10 pairs; labels openly published since project-site update (verified 2026-09-09)
      test_sealed: true
    references:
      - url: https://rcdaudt.github.io/oscd/
        supports: dataset size, bands, resolutions, registration, label scope, open test labels
      - url: https://ieee-dataport.org/open-access/oscd-onera-satellite-change-detection
        supports: publisher page, CC BY 4.0 metadata, login-gated archive transport
      - url: https://doi.org/10.1109/IGARSS.2018.8518015
        supports: original dataset paper (Daudt et al., IGARSS 2018)
    blockers:
      - "archive file list, member layout, size, and checksum not frozen: IEEE DataPort downloads require a free account login"
      - on-disk band/tiling layout and per-tile geotransforms not observed locally
      - official page exposes no immutable dataset release identifier; first authorized download must record archive size and SHA-256

