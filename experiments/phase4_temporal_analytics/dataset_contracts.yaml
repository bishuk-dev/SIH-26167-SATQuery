      mirror_role: official_repository_with_external_image_links
      expected_files: [train/A, train/B, train/label, val/A, val/B, val/label, test/A, test/B, test/label]
      expected_size_bytes: null
      publisher_hashes: {}
      locally_verified_sha256: null
    contract:
      modalities: [optical_rgb]
      sensors: [Google_Earth_VHR]
      bands_or_polarizations: [R, G, B]
      radiometric_domain: 8_bit_RGB_patch_files; no GeoTIFF/CRS assumption; file format verified at acquisition
      spatial_resolution_m: 0.5
      patch_size_px: [1024, 1024]
      pair_count: 637
      pair_order: A_is_T1_pre_then_B_is_T2_post
      labels: binary building-related change (1=change, 0=unchanged)
      label_values: [0_unchanged, 1_change]
