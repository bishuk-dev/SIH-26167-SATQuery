# Kaggle experiment registry
# Each entry maps a short experiment name to everything runner.py needs.
#
# Fields:
#   notebook         - path from repo root to the source .ipynb file
#   kernel_slug      - the Kaggle kernel slug (username/<slug> is derived at runtime)
#   experiment_dir   - repo-relative path used as the local results destination
#   remote_output_dir - subdirectory name under /kaggle/working/satquery-output/
#                       that the notebook writes its artifacts into
#   result_files     - list of relative paths within remote_output_dir to copy locally
#   gpu              - true/false (GPU jobs default to Kaggle NvidiaTeslaT4 / T4 x2)
#   internet         - true/false (passed to kernel-metadata.json; required to clone repo)
#   download_policy  - metadata_only excludes declared large_result_files from local retrieval

phase3a-grounding-baseline:
  notebook: notebooks/kaggle_phase3a.ipynb
  kernel_slug: satquery-phase3a-grounding
  experiment_dir: experiments/phase3a_grounding_dino_vrsbench
  remote_output_dir: phase3a-grounding-dino
  result_files:
    - validation_metrics.json
    - validation_predictions.jsonl
  gpu: true
  internet: true

